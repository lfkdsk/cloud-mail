name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[routes]]
pattern = "mail.lfkdsk.org"
custom_domain = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "email"
database_id = "f9a1bad3-bccf-4ae6-8d9f-8080e51664c9"

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "1dd1c970d5e2487cab7ae5e4d4ed65b3"

#[[r2_buckets]]			#R2 未启用，需要附件功能时取消注释并填写桶名
#binding = "r2"
#bucket_name = ""

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]	#每30分钟刷新分析缓存，每天晚上12点执行每日任务

[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
domain = ["lfkdsk.org"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "admin@lfkdsk.org"				#管理员的邮箱	示例: admin@example.com
#jwt_secret 通过 `wrangler secret put jwt_secret` 设置为机密，不写入此文件

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
